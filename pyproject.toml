[project]
name = "pycololight"
version = "2.1.0"
description = "A Python3 wrapper for interacting with LifeSmart Cololight"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "BazaJayGee66" }]
requires-python = ">=3.12"
dependencies = []

[project.urls]
Repository = "https://github.com/BazaJayGee66/pycololight"

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
source-include = ["CHANGELOG.md"]

[tool.pytest]
testpaths = ["tests"]
