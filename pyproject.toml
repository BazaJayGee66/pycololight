[project]
name = "pycololight"
version = "3.0.0"
description = "A Python3 wrapper for interacting with LifeSmart Cololight"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "BazaJayGee66" }]
requires-python = ">=3.12"
dependencies = []

[project.urls]
Repository = "https://github.com/BazaJayGee66/pycololight"

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest>=9,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=7,<8",
    "ruff==0.17.4",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
source-include = ["CHANGELOG.md"]

[tool.pytest]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint]
extend-select = ["I", "UP"]

[tool.mypy]
files = ["pycololight"]
disallow_untyped_defs = true
